# copy the whole khaneh/ folder to the root of a FAT32 microSD card.
# lines starting with # or ; are ignored.

wifi_ssid=YourHomeWiFi
wifi_pass=YourWiFiPassword

# where the dashboard runs, no trailing slash
server_url=http://192.168.1.50:3000
# must equal HUB_API_KEY in dashboard/.env.local
api_key=change-me-to-a-long-random-string

# shown in alerts
site_name=Home
# informational; the clock offset comes from SITE_TIMEZONE on the dashboard
timezone=Asia/Tehran
